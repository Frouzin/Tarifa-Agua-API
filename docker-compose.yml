version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tarifa_agua_postgres
    environment:
      POSTGRES_DB: tarifa_agua
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
    - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
